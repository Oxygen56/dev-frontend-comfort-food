<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Home Ratio — CSS Art cover</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;overflow:hidden;color:#301712;background:#fff7df;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}.cover{position:relative;display:grid;grid-template-columns:.92fr 1.08fr;width:100%;height:100%;border:20px solid #fff7df;background:linear-gradient(90deg,#fff7df 0 46%,#c66f3f 46%)}.copy{position:relative;z-index:4;padding:26px 10px 20px 18px}.kicker{margin:0 0 15px;color:#b93124;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{margin:0;font-size:76px;line-height:.7;letter-spacing:-.075em;text-transform:uppercase}.title em{color:#b93124;font:400 77px/.8 ui-serif,Georgia,serif;text-transform:none}.title em:after{content:"";display:block;width:270px;height:8px;margin-top:5px;border-radius:9px;background:#f6b913;transform:rotate(-2deg)}.ratios{position:absolute;left:18px;right:-18px;bottom:20px;display:flex;gap:8px}.ratios span{padding:9px 14px;border:2px solid #301712;border-radius:99px;background:#fff7df;font-size:11px;font-weight:900;letter-spacing:.04em}.ratios span:nth-child(2){color:#fff7df;background:#301712}.art{position:relative;overflow:hidden}.note{position:absolute;z-index:4;top:25px;right:28px;margin:0;color:#fff7df;font:400 37px/.9 ui-serif,Georgia,serif;letter-spacing:-.04em;text-align:right;transform:rotate(2deg)}.bowl{position:absolute;z-index:3;width:500px;height:360px;left:48%;top:63%;transform:translate(-50%,-50%)}.rim{position:absolute;z-index:3;inset:0 0 110px;border:8px solid #f8e8bd;border-radius:50%;background:#76a8a0;box-shadow:inset 0 0 0 3px #301712,0 0 0 3px #301712}.dish{position:absolute;inset:22px;border:3px solid #301712;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 20%,#f2883b,#b93124 72%)}.body{position:absolute;inset:130px 28px 0;display:grid;place-items:center;border:3px solid #301712;border-top:0;border-radius:0 0 48% 48%/0 0 78% 78%;background:repeating-radial-gradient(circle at 50% -100%,transparent 0 48px,rgb(48 23 18/.15) 49px 52px),#76a8a0}.body b{margin-top:45px;padding:6px 13px;border:2px solid #301712;border-radius:99px;background:#fff7df;font-size:11px;letter-spacing:.13em}.tomato,.egg{position:absolute;display:block;border:3px solid #301712}.tomato{width:100px;height:82px;border-radius:60% 20% 55% 25%;background:radial-gradient(circle at 35% 30%,#ff9a70 0 8%,transparent 9%),linear-gradient(145deg,#f35635,#9e271d)}.egg{width:125px;height:68px;border-radius:65% 35% 70% 30%;background:linear-gradient(155deg,#ffe887,#f6b913)}.t1{left:25px;top:45px;transform:rotate(-14deg)}.t2{left:190px;top:20px;transform:rotate(18deg)}.t3{right:15px;top:80px;transform:rotate(50deg)}.e1{left:70px;top:120px;transform:rotate(18deg)}.e2{left:245px;top:95px;transform:rotate(-12deg)}.e3{right:25px;top:5px;transform:rotate(24deg)}.steam{position:absolute;z-index:2;width:25px;height:105px;top:-45px;border-radius:50%;border-left:7px solid rgb(255 247 223/.75)}.s1{left:42%;transform:rotate(-12deg)}.s2{left:56%;height:85px;transform:rotate(13deg)}.stamp{position:absolute;z-index:5;right:18px;bottom:16px;padding:7px 10px;border:2px solid #301712;border-radius:6px;background:#fff7df;font-size:10px;font-weight:900;letter-spacing:.08em;transform:rotate(-4deg)}
  </style>
</head>
<body>
  <main class="cover">
    <section class="copy">
      <p class="kicker">番茄炒蛋 · Pure CSS Art</p>
      <h1 class="title">The Home<br><em>Ratio</em></h1>
      <div class="ratios" aria-hidden="true"><span>60 · tomato</span><span>50 · balance</span><span>40 · egg</span></div>
    </section>
    <section class="art" aria-label="A CSS-drawn bowl of tomato and egg">
      <p class="note">the ratio<br>we never wrote</p>
      <div class="bowl" aria-hidden="true">
        <i class="steam s1"></i><i class="steam s2"></i>
        <div class="rim"><div class="dish"><i class="tomato t1"></i><i class="tomato t2"></i><i class="tomato t3"></i><i class="egg e1"></i><i class="egg e2"></i><i class="egg e3"></i></div></div>
        <div class="body"><b>家的比例</b></div>
      </div>
      <p class="stamp">100% HTML + CSS</p>
    </section>
  </main>
</body>
</html>
